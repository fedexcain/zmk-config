# --- Dongle (central) ---

# Pull both halves' battery levels to the central, so the screen (and the host
# OS) can show them. 
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# BLE connection stability (match the halves)
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Ambient light sensor stays OFF currently
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
