# Role
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

# Keyboard identity
CONFIG_ZMK_KEYBOARD_NAME="Redox"

# Battery: already implied by BLE, but explicit is fine.
# 60s interval is reasonable; default is also 60 so this line
# is optional but harmless to keep for clarity.
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Fetch and proxy the right half's battery level to the host.
# Without these you only see the left half's battery in your OS.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# DISABLED - does not feel nice to have to reconnect every 15 min.
# Power: idle timeout stays at default 30s which is fine.
# Deep sleep is useful even if you keep it always on —
# it'll kick in after 15 minutes of no use and save significant
# battery compared to staying connected indefinitely.
CONFIG_ZMK_SLEEP=n
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# BLE connection stability improvement — documented as planned default
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
